# Builds the extension (Vite) and publishes it to GitHub Pages on every push to main.
# In the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy extension to Pages
on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extension/dist
      - id: deployment
        uses: actions/deploy-pages@v4
